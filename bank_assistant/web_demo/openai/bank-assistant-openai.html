<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<title>مساعد الوثائق البنكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one-screen app — top bar, sources panel (drawer on phones) beside a chat column. */
:root {
  --bg: #eef3f4; --surface: #ffffff; --surface-2: #f6f9f9; --ink: #13232a; --muted: #586a72;
  --line: #dbe4e7; --line-strong: #c3d0d5;
  --brand: #0f4c5c; --brand-strong: #0a3946; --brand-soft: #e1eef1; --on-brand: #ffffff; --ring: rgba(15, 76, 92, .24);
  --gold: #d9a63a; --gold-soft: #fbf0d6;
  --ok: #1b7a4e; --ok-soft: #e3f3ea; --bad: #b2372c; --bad-soft: #fbebe9; --on-bad: #ffffff;
  --shadow: 0 10px 34px rgba(12, 38, 46, .10);
  --font: "IBM Plex Sans Arabic", -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
  --r: 12px; --r-lg: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1417; --surface: #131d21; --surface-2: #18252a; --ink: #e0e9ec; --muted: #90a3ab;
    --line: #233238; --line-strong: #31444c;
    --brand: #62b5c8; --brand-strong: #8ccbd9; --brand-soft: #14303a; --on-brand: #06181d; --ring: rgba(98, 181, 200, .3);
    --gold: #e3b552; --gold-soft: #3a3020;
    --ok: #6fcf9d; --ok-soft: #142f27; --bad: #f08a7e; --bad-soft: #3a1d1b; --on-bad: #2a0d0a;
    --shadow: 0 10px 34px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1417; --surface: #131d21; --surface-2: #18252a; --ink: #e0e9ec; --muted: #90a3ab;
  --line: #233238; --line-strong: #31444c;
  --brand: #62b5c8; --brand-strong: #8ccbd9; --brand-soft: #14303a; --on-brand: #06181d; --ring: rgba(98, 181, 200, .3);
  --gold: #e3b552; --gold-soft: #3a3020;
  --ok: #6fcf9d; --ok-soft: #142f27; --bad: #f08a7e; --bad-soft: #3a1d1b; --on-bad: #2a0d0a;
  --shadow: 0 10px 34px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.65; overflow: hidden; }
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.muted { color: var(--muted); }
.pad { padding: 10px 14px; margin: 0; font-size: .88rem; }
svg { display: block; }

.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand-name { font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: .7rem; font-weight: 600; padding: 1px 9px; border-radius: 999px; background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold); white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 12px; border-radius: 10px; border: 0; background: none; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 10px; background: none; cursor: pointer; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.only-phone { display: none; }

.notice { flex: none; display: flex; gap: 8px; align-items: center; padding: 4px 8px 4px 16px; padding-inline: 16px 8px; font-size: .8rem; color: var(--ink); background: var(--gold-soft); border-bottom: 1px solid var(--line); }
.notice p { margin: 0; flex: 1; min-width: 0; }
.notice-x { width: 32px; height: 32px; color: var(--ink); }
.notice a { color: var(--brand); font-weight: 600; }

.main { flex: 1; display: flex; min-height: 0; position: relative; }
.panel { width: 312px; flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-inline-end: 1px solid var(--line); }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 4px; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.tools-row { padding: 6px 14px 10px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.field { width: 100%; min-height: 38px; padding: 7px 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); outline: none; }
.field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
.sel-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: .8rem; }
.sel-row .muted { font-variant-numeric: tabular-nums; }
.link { border: 0; background: none; padding: 2px 4px; color: var(--brand); font-weight: 600; font-size: .8rem; cursor: pointer; }
.link:hover { text-decoration: underline; }
.source-list { flex: 1; overflow-y: auto; padding: 4px 6px 10px; min-height: 120px; }
.group { margin-top: 6px; }
.group-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: .76rem; font-weight: 700; color: var(--muted); cursor: pointer; }
.count { margin-inline-start: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.doc { display: flex; align-items: flex-start; gap: 4px; border-radius: 10px; }
.doc:hover { background: var(--surface-2); }
.doc-main { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; cursor: pointer; }
input[type="checkbox"] { width: 16px; height: 16px; margin: 4px 0 0; accent-color: var(--brand); flex: none; }
.tag { display: inline-grid; place-items: center; min-width: 34px; height: 19px; padding: 0 5px; margin-top: 2px; border-radius: 5px; flex: none; font-size: .6rem; font-weight: 700; letter-spacing: .04em; color: #fff; background: #63747d; direction: ltr; }
.tag-pdf { background: #b8392d; } .tag-docx { background: #2b5797; } .tag-xlsx, .tag-csv { background: #1d6f43; }
.doc-text { min-width: 0; display: flex; flex-direction: column; }
.doc-title { font-size: .88rem; line-height: 1.45; overflow-wrap: anywhere; }
.doc-meta { font-size: .72rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ex-badge { font-size: .64rem; font-weight: 700; padding: 0 6px; border-radius: 999px; background: var(--gold-soft); border: 1px solid var(--gold); color: var(--ink); }
.del { margin-top: 3px; width: 32px; height: 32px; }
.del:hover { color: var(--bad); background: var(--bad-soft); }
.load-bad { color: var(--bad); font-weight: 600; }
.doc.asking { background: var(--bad-soft); flex-wrap: wrap; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 0 10px 8px; font-size: .78rem; width: 100%; }
.btn-danger { border: 0; border-radius: 8px; padding: 4px 10px; background: var(--bad); color: var(--on-bad); font-weight: 600; cursor: pointer; font-size: .78rem; }
.btn-plain { border: 1px solid var(--line-strong); border-radius: 8px; padding: 3px 10px; background: var(--surface); cursor: pointer; font-size: .8rem; font-weight: 600; }
.btn-plain:hover { border-color: var(--brand); color: var(--brand); }

.up-panel { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.up-panel h3 { margin: 0; font-size: .86rem; }
.dropzone { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; padding: 14px 10px; border: 2px dashed var(--line-strong); border-radius: var(--r); background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s; }
.dropzone:hover, .dropzone.drag { border-color: var(--brand); background: var(--brand-soft); }
.dropzone svg { width: 24px; height: 24px; stroke: var(--brand); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.dropzone strong { font-size: .82rem; }
.dropzone span { font-size: .72rem; color: var(--muted); }
.dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.up-cat-label { font-size: .74rem; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 4px; }
.up-list { display: flex; flex-direction: column; gap: 4px; max-height: 30vh; overflow-y: auto; }
.up-row { display: flex; justify-content: space-between; gap: 8px; font-size: .76rem; padding: 5px 8px; border-radius: 8px; background: var(--surface-2); }
.up-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up-state { flex: none; color: var(--muted); }
.up-row[data-state="ok"] .up-state { color: var(--ok); }
.up-row[data-state="bad"] { background: var(--bad-soft); flex-direction: column; }
.up-row[data-state="bad"] .up-state { color: var(--bad); white-space: normal; }
.memory-note { margin: 0; font-size: .74rem; color: var(--muted); }
.up-row[data-state="warn"] .up-state { color: var(--bad); }
.key-banner { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; background: var(--brand-soft); border-bottom: 1px solid var(--line); font-size: .86rem; font-weight: 600; }
.btn-key { border: 0; border-radius: 10px; padding: 7px 14px; background: var(--brand); color: var(--on-brand); font-weight: 600; cursor: pointer; }
.btn-key:disabled { opacity: .5; cursor: default; }
#no-docs .btn-key { margin-top: 12px; }
.settings-card { max-height: 92%; }
.settings-body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.set-label { font-weight: 600; font-size: .86rem; margin-top: 4px; }
.key-row { display: flex; gap: 8px; }
.key-row .field { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, Consolas, monospace; }
.set-note { margin: 0; font-size: .76rem; color: var(--muted); }
.set-check { display: flex; gap: 8px; align-items: flex-start; font-size: .84rem; margin-top: 6px; cursor: pointer; }
.set-status { margin: 4px 0 0; font-size: .84rem; min-height: 1.2em; color: var(--muted); }
.set-status.ok { color: var(--ok); font-weight: 600; } .set-status.bad { color: var(--bad); font-weight: 600; }
.set-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.set-warn { color: var(--ink); background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 8px; padding: 6px 9px; }
.backdrop { display: none; }

.chat { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.messages { flex: 1; overflow-y: auto; padding: 22px 16px 8px; }
.messages > * { max-width: 820px; margin-inline: auto; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 5vh 4px 20px; gap: 6px; }
.empty > svg { width: 60px; height: 60px; margin-bottom: 6px; }
.empty h1 { margin: 0; font-size: 1.35rem; line-height: 1.35; text-wrap: balance; }
.empty p { margin: 0; max-width: 520px; color: var(--muted); }
.examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: .86rem; text-align: start; }
.chip:hover { border-color: var(--brand); color: var(--brand); }

.msg { display: flex; gap: 10px; margin-bottom: 20px; }
.msg.user { justify-content: flex-end; }
.bubble { max-width: min(85%, 620px); background: var(--brand); color: var(--on-brand); padding: 9px 15px; border-radius: 18px; border-end-end-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bot-mark svg { width: 30px; height: 30px; }
.bot-body { flex: 1; min-width: 0; }
.status { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .88rem; padding: 4px 0; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); opacity: .3; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.answer { overflow-wrap: anywhere; }
.answer p { margin: 0 0 .65em; }
.answer ul, .answer ol { margin: 0 0 .75em; padding-inline-start: 1.35em; }
.answer li { margin-bottom: .25em; }
.answer h4 { margin: .9em 0 .35em; font-size: 1rem; }
.answer code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: .88em; }
.answer.muted { color: var(--muted); }
.tbl { overflow-x: auto; margin: 0 0 .9em; }
.tbl table { border-collapse: collapse; font-size: .88rem; min-width: 100%; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 5px 9px; text-align: start; vertical-align: top; }
.tbl th { background: var(--surface-2); }
.caret::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-inline-start: 2px; background: var(--brand); vertical-align: -2px; animation: blink 1s steps(2) infinite; }
.cite { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; margin: 0 2px; border: 0; border-radius: 6px; background: var(--brand-soft); color: var(--brand); font-size: .7rem; font-weight: 700; cursor: pointer; vertical-align: 2px; line-height: 1; direction: ltr; }
.cite:hover { background: var(--brand); color: var(--on-brand); }
.note { margin: 4px 0 0; font-size: .84rem; color: var(--muted); }
.note.bad { color: var(--bad); }
.srcs { margin-top: 8px; }
.srcs-title { margin: 0 0 6px; font-size: .74rem; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.card { min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); transition: border-color .2s, box-shadow .2s; }
.card.flash { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.card header { display: flex; gap: 8px; align-items: flex-start; }
.num { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: var(--on-brand); font-size: .72rem; font-weight: 700; flex: none; direction: ltr; }
.card h5 { margin: 0; font-size: .86rem; line-height: 1.35; overflow-wrap: anywhere; }
.loc { margin: 0; font-size: .72rem; color: var(--muted); }
.excerpt { margin: 0; font-size: .8rem; color: var(--muted); line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.excerpt.open { display: block; }
.card .link { align-self: flex-start; padding: 0; }
details.more { margin-top: 8px; }
details.more summary { cursor: pointer; font-size: .8rem; color: var(--muted); font-weight: 600; }
details.more .cards { margin-top: 8px; }
.tools { margin-top: 4px; }

.composer { flex: none; padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.box { max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 7px; padding-inline-start: 15px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 20px; box-shadow: var(--shadow); }
.box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--ring); }
.box textarea { flex: 1; min-width: 0; border: 0; outline: none; background: none; resize: none; max-height: 170px; min-height: 26px; padding: 7px 0; line-height: 1.5; font-size: 1rem; }
.send { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 0; border-radius: 14px; background: var(--brand); color: var(--on-brand); cursor: pointer; }
.send:disabled { opacity: .4; cursor: default; }
.send svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
[dir="rtl"] .send .i-send { transform: scaleX(-1); }
.send .i-stop { display: none; fill: currentColor; stroke: none; }
.send.busy .i-send { display: none; } .send.busy .i-stop { display: block; }
.disclaimer { margin: 6px auto 0; max-width: 820px; text-align: center; font-size: .72rem; color: var(--muted); }
.composer-foot { max-width: 820px; margin: 6px auto 0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 14px; }
.composer-foot .disclaimer { margin: 0; flex: 1 1 240px; }
.mode-toggle { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; cursor: pointer; user-select: none; flex: none; position: relative; }
.mode-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.mode-toggle .switch { width: 30px; height: 17px; border-radius: 999px; background: var(--line-strong); position: relative; flex: none; transition: background .15s; }
.mode-toggle .switch::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--surface); transition: inset-inline-start .15s; }
.mode-toggle input:checked + .switch { background: var(--brand); }
.mode-toggle input:checked + .switch::after { inset-inline-start: 15px; }
.mode-toggle input:focus-visible + .switch { outline: 3px solid var(--ring); outline-offset: 2px; }
.tips { font-size: .8rem; color: var(--muted); max-width: 520px; }
.sum { margin-top: 3px; width: 32px; height: 32px; opacity: .6; }
.sum .spark { fill: currentColor; stroke: none; }
.doc:hover .sum, .sum:focus-visible { opacity: 1; }
.sum:hover { color: var(--brand); opacity: 1; }
@media (pointer: coarse) { .sum { opacity: .9; } }
.ocr-badge.warn { background: var(--bad-soft); border-color: var(--bad); }
.ocr-badge { display: inline-block; font-size: .64rem; font-weight: 700; padding: 0 6px; border-radius: 999px; background: var(--gold-soft); border: 1px solid var(--gold); color: var(--ink); cursor: help; vertical-align: 1px; }
.summary-head { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
.summary-meta { margin: 0 0 8px; font-size: .76rem; color: var(--muted); }
.summary-meta:empty { display: none; }
.page-ref { border: 0; background: none; padding: 0; color: var(--brand); font: inherit; cursor: pointer; white-space: nowrap; }
.page-ref:hover { text-decoration: underline; }
.tools { display: flex; gap: 6px; }

.reader { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 16px; background: rgba(6, 20, 25, .5); }
.reader-card { width: min(640px, 100%); max-height: 85%; display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; }
.reader-card header { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.reader-card header > div { flex: 1; min-width: 0; }
.reader-card h3 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
.reader-text { margin: 0; padding: 14px 16px 18px; overflow-y: auto; white-space: pre-line; line-height: 1.75; overflow-wrap: anywhere; }
.toast { position: fixed; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 90; max-width: calc(100% - 32px); padding: 9px 16px; border-radius: 10px; background: var(--ink); color: var(--surface); font-size: .86rem; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }

@media (max-width: 860px) {
  .only-phone { display: inline-grid; }
  .panel { position: fixed; top: 0; bottom: 0; inset-inline-start: 0; z-index: 70; width: min(88vw, 340px); box-shadow: var(--shadow); transform: translateX(-105%); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; padding-top: env(safe-area-inset-top, 0px); }
  [dir="rtl"] .panel { transform: translateX(105%); }
  .panel.open, [dir="rtl"] .panel.open { transform: none; visibility: visible; transition: transform .25s ease, visibility 0s; }
  .backdrop { display: block; position: fixed; inset: 0; z-index: 65; background: rgba(6, 20, 25, .45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
}
@media (max-width: 560px) {
  .bar { padding: 6px 10px; gap: 2px; }
  .hide-sm { display: none; }
  .brand-name { font-size: .92rem; }
  .messages { padding: 16px 12px 6px; }
  .composer { padding: 6px 10px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .cards { grid-template-columns: 1fr; }
  .bubble { max-width: 90%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div class="app">

<script>
/* Core text pipeline (port of bankrag/textproc.py + ingest.py): normalisation, bidi repair,
   chunking and BM25 search. Pure functions, no DOM. */
const Core = (() => {
  "use strict";

  // ------------------------------------------------------------------ normalisation
  const DIGIT_MAP = { "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4", "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
    "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4", "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9" };
  const ARABIC_LETTER = /[ء-ي]/;
  const TOKEN = /[\p{L}\p{N}_]+/gu;

  function cleanText(text) {
    if (!text) return "";
    return text.normalize("NFKC")
      .replace(/ـ/g, "").replace(/\u0000/g, "")
      .replace(/[ \t ​‎‏‪-‮⁦-⁩]+/g, " ")
      .replace(/ *\n */g, "\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  function normalize(text) {
    if (!text) return "";
    return text.normalize("NFKC").normalize("NFKD").replace(/\p{Mn}/gu, "")
      .replace(/ـ/g, "").replace(/ى/g, "ي").replace(/ة/g, "ه")
      .replace(/[٠-٩۰-۹]/g, (d) => DIGIT_MAP[d]).toLowerCase();
  }

  const AR_PREFIXES = ["وال", "بال", "كال", "فال", "لل", "ال"];
  const AR_SUFFIXES = ["ها", "ان", "ات", "ون", "ين", "يه", "ه", "ي"];

  function stem(token) {
    if (ARABIC_LETTER.test(token)) {
      if (token.length >= 4 && token.startsWith("و")) token = token.slice(1);
      for (const p of AR_PREFIXES) {
        if (token.startsWith(p) && token.length - p.length >= 2) { token = token.slice(p.length); break; }
      }
      for (const s of AR_SUFFIXES) {
        if (token.length - s.length >= 2 && token.endsWith(s)) token = token.slice(0, -s.length);
      }
      return token;
    }
    if (/^\d+$/.test(token)) return token;
    if (token.length > 3 && (token.endsWith("s") || token.endsWith("x"))) token = token.slice(0, -1);
    return token;
  }

  const STOPWORDS_RAW = `
في من على الى إلى عن مع هذا هذه هذان ذلك تلك التي الذي الذين اللذين اللتي التى هو هي هم هن انا أنا نحن انت أنت
هل ما ماذا كيف متى أين اين لماذا كم أي اي او أو ثم ان أن إن كان كانت يكون تكون قد لقد لا لم لن ليس ليست بين حتى
عند عندما كل بعض غير بعد قبل اذا إذا كما لكن ايضا أيضا نحو حول ضمن خلال منذ لدى الا إلا وفق حسب فيه فيها منه منها
عليه عليها له لها به بها هناك هنا تم يتم وهو وهي كذلك اريد أريد اعرف أعرف ارجو أرجو يرجى
le la les l de des du d un une et ou en au aux a à pour par sur dans avec sans que qu qui quoi quel quelle quels
quelles est sont etre être ce cet cette ces se sa son ses leur leurs il elle ils elles on nous vous je j tu y ne n
pas plus comme mais donc car si quand comment combien
the a an of to in on for and or is are what how which who when where with by from at as be this that it do does`;
  const STOPWORDS = new Set(STOPWORDS_RAW.split(/\s+/).filter(Boolean).map(normalize));

  function tokenize(text) {
    const out = [];
    for (const raw of normalize(text).match(TOKEN) || []) {
      if (STOPWORDS.has(raw) || (raw.length < 2 && !/^\d$/.test(raw))) continue;
      const tok = stem(raw);
      if (!tok || STOPWORDS.has(tok)) continue;
      out.push(tok);
    }
    return out;
  }

  function detectLang(text) {
    const ar = (text.match(/[ء-ي]/g) || []).length;
    const lat = (text.match(/[A-Za-zÀ-ÿ]/g) || []).length;
    return ar >= lat ? "ar" : "fr";
  }

  // ------------------------------------------------------------------ bidi repair
  // PDFs store glyphs in drawing (visual) order. To recover reading (logical) order we resolve
  // embedding levels with the Unicode bidi algorithm (rules W1-W7, N1-N2, I1-I2 for one
  // paragraph without explicit embeddings) and undo the line reordering (rule L2).
  const RTL_CHAR = /[\u0590-\u065F\u066A-\u06EF\u06FA-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFE]/;
  const LTR_CHAR = /[A-Za-z0-9\u00C0-\u024F\u0660-\u0669\u06F0-\u06F9]/;
  const LATIN_LETTER = /[A-Za-z\u00C0-\u024F]/;
  const JOINERS = new Set([" ", ".", ",", ":", "/", "-", "'", "’", "_"]);
  const MIRROR = { "(": ")", ")": "(", "[": "]", "]": "[", "{": "}", "}": "{", "<": ">", ">": "<", "«": "»", "»": "«" };

  const PCT_BEFORE_NUMBER = /(?<![0-9٠-٩])([%٪‰])([0-9]+(?:[.,][0-9]+)*|[٠-٩]+(?:[٫٬][٠-٩]+)*)/g;
  const isRtl = (g) => RTL_CHAR.test(g);
  const isLtr = (g) => LTR_CHAR.test(g) && !RTL_CHAR.test(g);

  function bidiType(g) {
    const ch = g ? g[0] : " ";
    if (/\p{Mn}/u.test(ch)) return "NSM";
    if (/[\u0660-\u0669\u066B\u066C]/.test(ch)) return "AN";
    if (/[0-9\u06F0-\u06F9]/.test(ch)) return "EN";
    if (ch === "\u060C") return "CS";
    if (/[\u066A%\u2030\u2031$\u20AC\u00A3\u00A5#\u00B0\u00A2]/.test(ch)) return "ET";
    if (/[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFE]/.test(ch)) return "R";
    if (/[+\-\u2212]/.test(ch)) return "ES";
    if (/[,.:/\u00A0]/.test(ch)) return "CS";
    if (/\s/.test(ch)) return "WS";
    if (/\p{L}/u.test(ch)) return "L";
    return "ON";
  }

  /** Embedding level (0, 1 or 2) of each character, in logical order, for a paragraph of base level 0 or 1. */
  function resolveLevels(types, rtl) {
    const base = rtl ? "R" : "L";
    const t = types.slice();
    const n = t.length;
    for (let i = 0; i < n; i++) if (t[i] === "NSM") t[i] = i ? t[i - 1] : base;            // W1
    let last = "sos";   // the paragraph start is not an Arabic letter: a leading number stays European
    for (let i = 0; i < n; i++) {                                                          // W2
      if (t[i] === "R" || t[i] === "L") last = t[i];
      else if (t[i] === "EN" && last === "R") t[i] = "AN";
    }
    for (let i = 1; i < n - 1; i++) {                                                      // W4
      if (t[i] === "ES" && t[i - 1] === "EN" && t[i + 1] === "EN") t[i] = "EN";
      else if (t[i] === "CS" && (t[i - 1] === "EN" || t[i - 1] === "AN") && t[i + 1] === t[i - 1]) t[i] = t[i - 1];
    }
    for (let i = 0; i < n; i++) {                                                          // W5
      if (t[i] !== "ET") continue;
      let j = i;
      while (j < n && t[j] === "ET") j++;
      if ((i > 0 && t[i - 1] === "EN") || (j < n && t[j] === "EN")) for (let k = i; k < j; k++) t[k] = "EN";
      i = j - 1;
    }
    for (let i = 0; i < n; i++) if (t[i] === "ES" || t[i] === "ET" || t[i] === "CS") t[i] = "ON";   // W6
    last = base;
    for (let i = 0; i < n; i++) {                                                          // W7
      if (t[i] === "R" || t[i] === "L") last = t[i];
      else if (t[i] === "EN" && last === "L") t[i] = "L";
    }
    const strongOf = (x) => (x === "L" ? "L" : x === "R" || x === "EN" || x === "AN" ? "R" : null);
    for (let i = 0; i < n; i++) {                                                          // N1, N2
      if (t[i] !== "WS" && t[i] !== "ON") continue;
      let j = i;
      while (j < n && (t[j] === "WS" || t[j] === "ON")) j++;
      const before = i > 0 ? strongOf(t[i - 1]) : base;
      const after = j < n ? strongOf(t[j]) : base;
      const dir = before === after ? before : base;
      for (let k = i; k < j; k++) t[k] = dir;
      i = j - 1;
    }
    return t.map((x) => {                                                                  // I1, I2
      if (rtl) return x === "R" ? 1 : 2;
      return x === "L" ? 0 : x === "R" ? 1 : 2;
    });
  }

  function reverseRuns(items, minLevel) {
    const out = [];
    let i = 0;
    while (i < items.length) {
      if (items[i].level >= minLevel) {
        let j = i;
        while (j < items.length && items[j].level >= minLevel) j++;
        for (let k = j - 1; k >= i; k--) out.push(items[k]);
        i = j;
      } else out.push(items[i++]);
    }
    return out;
  }

  /** Approximate logical order (used only to resolve levels): reverse the line, keep letter/number clusters readable. */
  function flipRuns(seq, member) {
    const out = [];
    let i = 0;
    const n = seq.length;
    while (i < n) {
      if (member(seq[i].g)) {
        let j = i + 1;
        while (j < n) {
          if (member(seq[j].g)) { j++; continue; }
          if (JOINERS.has(seq[j].g)) {
            let k = j;
            while (k < n && JOINERS.has(seq[k].g)) k++;
            if (k < n && member(seq[k].g)) { j = k; continue; }
          }
          break;
        }
        for (let x = j - 1; x >= i; x--) out.push(seq[x]);
        i = j;
      } else out.push(seq[i++]);
    }
    return out;
  }

  function lineDirection(glyphs, rtlHint) {
    const strong = [];
    for (const g of glyphs) {
      if (isRtl(g)) strong.push("R");
      else if (LATIN_LETTER.test(g)) strong.push("L");   // digits are weak: they never decide the direction
    }
    if (!strong.includes("R")) return null;
    if (strong[0] === strong[strong.length - 1]) return strong[0] === "R";
    if (rtlHint !== undefined && rtlHint !== null) return rtlHint;
    return strong.filter((s) => s === "R").length >= strong.filter((s) => s === "L").length;
  }

  /** One line (or table cell) of glyph strings in visual (left-to-right) order -> logical text. */
  function visualToLogical(glyphs, rtlHint, forceDir) {
    const rtl = forceDir === undefined ? lineDirection(glyphs, rtlHint) : forceDir;
    if (rtl === null || !glyphs.some(isRtl)) return glyphs.join("");
    const visual = glyphs.map((g, pos) => ({ g, pos, level: 0 }));
    const approx = rtl ? flipRuns(visual.slice().reverse(), isLtr) : flipRuns(visual.slice(), isRtl);
    const levels = resolveLevels(approx.map((x) => bidiType(x.g)), rtl);
    approx.forEach((x, k) => { x.level = levels[k]; });
    const logical = reverseRuns(reverseRuns(visual, 1), 2);
    const text = logical.map((x) => (x.level % 2 === 1 && x.g.length === 1 && MIRROR[x.g] ? MIRROR[x.g] : x.g)).join("");
    // A line that continues an Arabic paragraph draws "6.5%" as "%6.5"; percentages are always
    // written number first in Arabic and French, so restore that order.
    return rtl ? text.replace(PCT_BEFORE_NUMBER, "$2$1") : text;
  }

  /** Logical text -> visual glyph order (rule L2), used to undo pdf.js's own per-item reordering. */
  function logicalToVisual(chars, rtl) {
    const levels = resolveLevels(chars.map(bidiType), rtl);
    const items = chars.map((g, i) => ({ g, level: levels[i] }));
    return reverseRuns(reverseRuns(items, 2), 1)
      .map((x) => (x.level % 2 === 1 && x.g.length === 1 && MIRROR[x.g] ? MIRROR[x.g] : x.g));
  }

  /** A row of visual segments (table cells split at wide gaps) -> one logical line. */
  function rowToLogical(segments, rtlHint) {
    const all = segments.flat();
    const rtl = lineDirection(all, rtlHint);
    if (rtl === null) return segments.map((s) => s.join("").trim()).filter(Boolean).join(" | ");
    const cells = segments.map((s) => visualToLogical(s, rtlHint, rtl).trim()).filter(Boolean);
    return (rtl ? cells.reverse() : cells).join(" | ");
  }

  /** pdf.js text items of one page -> logical lines. pdf.js already reorders each RTL item to
   *  logical order, so items are first put back into visual order, then the whole line is repaired. */
  const CELL_GAP = 1.6;   // a gap wider than 1.6 x font size separates table cells

  /** Vertical edges of drawn boxes and rules (table borders) from a pdf.js operator list: [{x, y0, y1}]. */
  function pdfEdgesFromOps(opList, OPS) {
    const edges = [];
    let ctm = [1, 0, 0, 1, 0, 0];
    const stack = [];

  const LS_LANG = "bankai.lang", LS_OFF = "bankai.deselected", LS_NOTICE = "bankai.noticeClosed";
  const LS_KEY = "bankai.openaiKey", LS_MODEL = "bankai.model", LS_SEM = "bankai.semantic", LS_MODE = "bankai.mode";
  const ssGet = (k) => { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } };
  const ssSet = (k, v) => { try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch (e) { /* unavailable */ } };
  const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) { /* unavailable */ } };
  // Keys pasted from chat apps often carry invisible direction marks, which fetch() cannot send in a header.
  const cleanKey = (v) => String(v || "").replace(/[\s\u00A0\u200B-\u200F\u202A-\u202E\u2060-\u2069\uFEFF]/g, "");
  const validKey = (v) => /^[\x21-\x7E]+$/.test(v);
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } };

  let lang = lsGet(LS_LANG, "ar") === "fr" ? "fr" : "ar";
  const T = () => STR[lang];

  // ------------------------------------------------------------------ state
  const TOP_K = 8, TOP_K_FULL = 24, CHUNK_SIZE = 1200, CHUNK_OVERLAP = 200, MAX_FILE = 50 * 1024 * 1024;
  const docs = new Map();          // id -> meta
  const chunksByDoc = new Map();   // id -> [{text,p0,p1,h}]
  const vecsByDoc = new Map();     // id -> {dim, data: Float32Array} (normalised embeddings, one row per chunk)
  const settings = {
    key: cleanKey(ssGet(LS_KEY) || lsGet(LS_KEY, "")),
    remember: Boolean(cleanKey(lsGet(LS_KEY, ""))),
    model: lsGet(LS_MODEL, "gpt-4o-mini"),
    semantic: lsGet(LS_SEM, "1") === "1",
  };
  const aiReady = () => Boolean(settings.key);
  let index = new Core.Index([]);
  let deselected = new Set(JSON.parse(lsGet(LS_OFF, "[]") || "[]"));
  let history = [];
  let busy = false, controller = null;
  const canEdit = true;
  let storeMode = "loading";

  const $ = (sel) => document.querySelector(sel);
  const esc = (v) => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  // ------------------------------------------------------------------ language
  function applyLang() {
    const s = T();
    document.documentElement.lang = lang;
    document.documentElement.dir = s.dir;
    document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = s[el.dataset.t]; });
    document.querySelectorAll("[data-tp]").forEach((el) => { el.placeholder = s[el.dataset.tp]; });
    document.querySelectorAll("[data-tl]").forEach((el) => { el.setAttribute("aria-label", s[el.dataset.tl]); el.title = s[el.dataset.tl]; });
    document.querySelectorAll("[data-th]").forEach((el) => { el.title = s[el.dataset.th]; });
    $("#lang-btn span").textContent = s.otherLabel;
    $("#examples").innerHTML = s.ex.map((q) => `<button type="button" class="chip" dir="auto">${esc(q)}</button>`).join("");
    renderSources();
    updateEmpty();
  }
  $("#lang-btn").addEventListener("click", () => {
    lang = T().other;
    lsSet(LS_LANG, lang);
    applyLang();
